name: Windows foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  required:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Bootstrap pinned local toolchain
        run: python scripts/bootstrap.py
      - name: Install locked Node dependencies
        run: tools/dev.cmd ci
      - name: Required static, contract and file checks
        run: .local/toolchain/node-v24.22.3-win-x64/node.exe scripts/verify-editor.mjs
      - name: Build Windows runtime package
        run: tools/dev.cmd run make
      - name: Isolated packaged startup and shutdown
        run: tools/dev.cmd run package:check -- --evidence-dir=evidence/phase10
      - name: Retain verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-evidence
          path: |
            evidence/phase10/packaged-run-*.json
            evidence/phase10/package-audit.json
            evidence/phase10/release-studio.png
            evidence/phase10/verification.json
            evidence/phase10/development-run.json
            evidence/phase10/review-ui.png
            evidence/phase10/project-ui.png
            evidence/phase10/release-project.png
            evidence/phase10/editor-ui.png
            evidence/phase10/release-editor*.png
          retention-days: 7
          if-no-files-found: error
